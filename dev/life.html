<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life: ambient details</title>
    <style>
      html, body { margin: 0; height: 100%; background: #9fb6c9; overflow: hidden; font-family: system-ui, sans-serif; }
      #c { width: 100%; height: 100%; display: block; touch-action: none; }
      #help { position: fixed; left: 12px; top: 12px; padding: 8px 10px; border-radius: 8px; background: rgba(20, 24, 32, 0.55); color: #f3efe6; font-size: 12px; line-height: 1.5; pointer-events: none; }
      #help b { color: #ffd98a; font-weight: 600; }
      #trample-label { position: fixed; left: 14px; bottom: 218px; color: #f3efe6; font-size: 11px; text-shadow: 0 1px 2px #000; pointer-events: none; display: none; }
      #pane { position: fixed; top: 12px; right: 12px; width: 290px; max-height: calc(100vh - 24px); overflow-y: auto; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="help"><b>WASD</b> walk · <b>Shift</b> run · <b>Space</b> jump · <b>drag</b> look · <b>wheel</b> zoom</div>
    <div id="trample-label">Trample map (octahedral, whole planet)</div>
    <div id="pane"></div>
    <script type="module" src="./life.ts"></script>
  </body>
</html>
