<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grass and wildflowers</title>
    <style>
      html, body { margin: 0; height: 100%; background: #cfd9e3; overflow: hidden; font: 12px/1.4 system-ui, sans-serif; }
      #c { width: 100%; height: 100%; display: block; touch-action: none; }
      #hint { position: fixed; left: 12px; bottom: 10px; color: #23303a; background: rgba(255, 255, 255, 0.55); padding: 6px 10px; border-radius: 8px; pointer-events: none; }
      #pane { position: fixed; top: 10px; right: 10px; width: 300px; max-height: calc(100vh - 20px); overflow-y: auto; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="pane"></div>
    <div id="hint">Ground view: drag to look, WASD to walk, wheel for eye height. Orbit view: drag to orbit, wheel to zoom.</div>
    <script type="module" src="./grass.ts"></script>
  </body>
</html>
