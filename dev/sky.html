<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky, sea of clouds and light</title>
    <style>
      html, body { margin: 0; height: 100%; background: #e9e4d8; overflow: hidden; }
      #c { width: 100%; height: 100%; display: block; touch-action: none; }
      .hint {
        position: fixed; left: 14px; bottom: 12px; padding: 6px 10px; border-radius: 6px;
        font: 12px/1.4 system-ui, sans-serif; color: #2b2f3a; background: rgba(255, 255, 255, 0.55);
        pointer-events: none; user-select: none;
      }
      .pane { position: fixed; top: 12px; right: 12px; width: 300px; max-height: calc(100vh - 24px); overflow-y: auto; z-index: 10; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="hint">Drag to orbit · Scroll to zoom · G: ground / orbit view · P: day / sunset</div>
    <script type="module" src="./sky.ts"></script>
  </body>
</html>
